<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manhattan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --paper:#fff; --mute:#e9e9e9; --line:1.5px; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#d3d3d3; color:var(--ink); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; overflow:hidden; }
  a { color:var(--ink); } a:hover { color:#555; }

  header { position:fixed; top:0; left:0; right:0; height:36px; z-index:1000; background:var(--paper); border-bottom:var(--line) solid var(--ink);
    display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
  header .count { font-family:"IBM Plex Mono",monospace; font-size:11px; color:#555; }
  header .right { display:flex; gap:14px; align-items:center; }
  button.closeall { font:inherit; text-transform:uppercase; letter-spacing:.06em; background:var(--paper); border:var(--line) solid var(--ink); padding:4px 10px; cursor:pointer; }
  button.closeall:hover { background:var(--ink); color:var(--paper); }
  button.closeall:disabled { opacity:.35; cursor:default; background:var(--paper); color:var(--ink); }

  #map { position:fixed; top:36px; left:0; right:0; bottom:0; background:#d3d3d3; }
  .hood-tip { font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; background:var(--paper); color:var(--ink); border:1px solid var(--ink); border-radius:0; box-shadow:none; padding:1px 6px; }
  .hood-tip::before { display:none; }
  .leaflet-interactive { cursor:pointer; }
  .leaflet-container { font-family:inherit; }
  .leaflet-control-attribution { font-size:10px; background:rgba(255,255,255,.85)!important; }
  .leaflet-control-zoom a { border-radius:0!important; color:var(--ink)!important; }
  .leaflet-bar { border:var(--line) solid var(--ink)!important; border-radius:0!important; box-shadow:none!important; }

  .hood-label { font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap;
    background:var(--paper); border:1px solid var(--ink); padding:1px 5px; transform:translate(-50%,-50%); display:inline-block; cursor:pointer; transition:background .12s,color .12s; }
  .hood-label:hover, .hood-label.hot { background:var(--ink); color:var(--paper); }

  #windows { position:fixed; inset:36px 0 0 0; pointer-events:none; z-index:900; }
  .win { position:absolute; pointer-events:auto; transform-origin:50% 0; animation:open .26s cubic-bezier(.2,.9,.25,1.15) both; }
  .win.closing { animation:shut .16s ease-in both; }
  @keyframes open { 0% { transform:scale(.6,.04); opacity:0; } 45% { transform:scale(1.02,.08); opacity:1; } 100% { transform:scale(1,1); } }
  @keyframes shut { to { transform:scale(.96,.04); opacity:0; } }

  .bar { height:26px; background:var(--paper); border:var(--line) solid var(--ink); display:grid; grid-template-columns:26px 1fr 26px; align-items:center; cursor:grab; user-select:none; }
  .bar:active { cursor:grabbing; }
  .bar .x { width:26px; height:23px; border:0; background:none; font:500 15px/1 "Helvetica Neue",Arial,sans-serif; cursor:pointer; padding:0; color:var(--ink); }
  .bar .x:hover { background:var(--ink); color:var(--paper); }
  .bar .title { text-align:center; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Main window: trapezoid body like the references */
  .main { width:340px; }
  .trap { position:relative; height:400px; margin-top:-1.5px; background:var(--ink);
    clip-path:polygon(0 0,100% 0,95.5% 100%,4.5% 100%); }
  .trap .inner { position:absolute; inset:0; clip-path:polygon(1.5px 0,calc(100% - 1.5px) 0,calc(95.5% - 1.6px) calc(100% - 1.5px),calc(4.5% + 1.6px) calc(100% - 1.5px));
    background:repeating-linear-gradient(135deg,#f4f4f4 0 7px,#e6e6e6 7px 8px); display:flex; align-items:center; justify-content:center; }
  .trap .inner img { width:100%; height:100%; object-fit:cover; }
  .ph { font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:#666; background:var(--paper); padding:3px 7px; border:1px solid #bbb; text-transform:uppercase; letter-spacing:.04em; }

  /* Small link tab: browser-ish */
  .tab { width:236px; background:var(--paper); border:var(--line) solid var(--ink); }
  .tab .bar { border:0; border-bottom:var(--line) solid var(--ink); }
  .chrome { display:flex; align-items:center; gap:6px; padding:6px 8px; border-bottom:1px solid var(--ink); font-size:12px; }
  .chrome .nav { display:flex; gap:7px; color:#888; font-size:12px; }
  .chrome .url { flex:1; min-width:0; border:1px solid var(--ink); border-radius:2px; padding:2px 6px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tab .body { padding:12px 10px 12px; display:flex; flex-direction:column; gap:10px; }
  .tab .label { font-size:22px; font-weight:700; letter-spacing:-.01em; line-height:1; }
  .tab .go { align-self:flex-start; font-family:"IBM Plex Mono",monospace; font-size:11px; text-decoration:none; border:1px solid var(--ink); padding:3px 9px; border-radius:20px; background:var(--paper); }
  .tab .go:hover { background:var(--ink); color:var(--paper); }
  .tab .go.empty { color:#999; border-color:#bbb; pointer-events:none; }

  .hint { position:fixed; left:14px; bottom:14px; z-index:800; font-family:"IBM Plex Mono",monospace; font-size:11px; background:var(--paper); border:1px solid var(--ink); padding:4px 8px; pointer-events:none; transition:opacity .4s; }
</style>
</head>
<body>
<header>
  <div>Manhattan</div>
  <div class="right">
    <span class="count" id="count">0 open</span>
    <button class="closeall" id="closeAll" disabled>Close all</button>
  </div>
</header>
<div id="map"></div>
<div id="windows"></div>
<div class="hint" id="hint">hover &amp; click a neighborhood</div>

<script>
// Fill in photo (image URL) and url (website) per neighborhood name later, e.g. 'SoHo': { photo:'', url:'' }
const CONTENT = {};
const PHOTOS = ["uploads/IMG_5837.JPG","uploads/IMG_5863%202.JPG","uploads/IMG_5876%204.JPG","uploads/IMG_5881%204.JPG","uploads/IMG_5890%204.JPG","uploads/IMG_5935.JPG","uploads/IMG_5981.JPG","uploads/IMG_5982.JPG","uploads/IMG_5983.JPG","uploads/IMG_5994.JPG","uploads/IMG_5995.JPG","uploads/IMG_5997.JPG","uploads/IMG_6001.JPG","uploads/IMG_6002.JPG","uploads/IMG_6003.JPG","uploads/IMG_6006.JPG","uploads/IMG_6008.JPG","uploads/IMG_6010.JPG","uploads/IMG_6013.JPG","uploads/IMG_6014.JPG","uploads/IMG_6015.JPG","uploads/IMG_6018.JPG","uploads/IMG_6020.JPG","uploads/IMG_6021.JPG"];
let photoIdx = 0;

const VIEW = L.latLngBounds([40.700,-74.020],[40.880,-73.907]);
const map = L.map('map', { zoomControl:true, minZoom:11, maxZoom:17, zoomSnap:0.25, attributionControl:false, maxBounds:VIEW.pad(0.4) });
map.fitBounds(VIEW);
let lastW = 0, lastH = 0;
function refit() {
  const el = document.getElementById('map');
  if (!el.clientWidth || (el.clientWidth === lastW && el.clientHeight === lastH)) return;
  lastW = el.clientWidth; lastH = el.clientHeight;
  map.invalidateSize({ pan:false });
  map.fitBounds(VIEW, { padding:[20,20] });
  map.fire('moveend');
}
new ResizeObserver(refit).observe(document.getElementById('map'));
window.addEventListener('load', refit);

const layer = document.getElementById('windows');
const countEl = document.getElementById('count');
const closeAllBtn = document.getElementById('closeAll');
let z = 10, openCount = 0, spawnN = 0;

function updateCount() {
  countEl.textContent = openCount + ' open';
  closeAllBtn.disabled = openCount === 0;
}
function front(el) { el.style.zIndex = ++z; }
function makeDraggable(win, handle) {
  handle.addEventListener('pointerdown', e => {
    if (e.target.closest('.x')) return;
    front(win);
    const sx = e.clientX, sy = e.clientY, ox = win.offsetLeft, oy = win.offsetTop;
    handle.setPointerCapture(e.pointerId);
    const move = ev => { win.style.left = (ox + ev.clientX - sx) + 'px'; win.style.top = (oy + ev.clientY - sy) + 'px'; };
    const up = () => { handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); };
    handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up);
  });
}
function closeWin(win) {
  if (win.classList.contains('closing')) return;
  win.classList.add('closing');
  openCount--; updateCount();
  win.addEventListener('animationend', () => win.remove(), { once:true });
}
function bar(title) {
  const b = document.createElement('div'); b.className = 'bar';
  b.innerHTML = '<button class="x" aria-label="Close">×</button><div class="title"></div><span></span>';
  b.querySelector('.title').textContent = title;
  return b;
}
function place(win, x, y, w, h) {
  const W = layer.clientWidth, H = layer.clientHeight;
  win.style.left = Math.max(8, Math.min(x, W - w - 8)) + 'px';
  win.style.top  = Math.max(8, Math.min(y, H - h - 8)) + 'px';
}
function addWin(win, x, y, w, h) {
  place(win, x, y, w, h); front(win);
  win.addEventListener('pointerdown', () => front(win));
  win.querySelector('.x').addEventListener('click', () => closeWin(win));
  makeDraggable(win, win.querySelector('.bar'));
  layer.appendChild(win);
  openCount++; updateCount();
}

function spawn(area, pt) {
  document.getElementById('hint').style.opacity = 0;
  const jitter = (spawnN++ % 6) * 14;
  const x = pt.x - 170 + jitter, y = pt.y - 60 + jitter;

  const main = document.createElement('div'); main.className = 'win main';
  main.appendChild(bar(area.name));
  const trap = document.createElement('div'); trap.className = 'trap';
  trap.innerHTML = '<div class="inner"></div>';
  const inner = trap.querySelector('.inner');
  if (area.photo) { const img = new Image(); img.src = area.photo; img.alt = area.name; inner.appendChild(img); }
  else inner.innerHTML = '<span class="ph">photo — ' + area.name.replace(/[<>&]/g,'') + '</span>';
  main.appendChild(trap);
  addWin(main, x, y, 340, 430);

  setTimeout(() => {
    const tab = document.createElement('div'); tab.className = 'win tab';
    tab.appendChild(bar('Link'));
    const chrome = document.createElement('div'); chrome.className = 'chrome';
    chrome.innerHTML = '<span class="nav"><span>←</span><span>→</span><span>↻</span></span><span class="url"></span>';
    chrome.querySelector('.url').textContent = area.url || 'http://';
    const body = document.createElement('div'); body.className = 'body';
    body.innerHTML = '<div class="label"></div><a class="go" target="_blank" rel="noopener">visit →</a>';
    body.querySelector('.label').textContent = area.name;
    const go = body.querySelector('.go');
    if (area.url) go.href = area.url; else go.classList.add('empty');
    tab.append(chrome, body);
    addWin(tab, x + 230, y + 300, 236, 140);
  }, 140);
}

const GEO = 'https://raw.githubusercontent.com/HodgesWardElliott/custom-nyc-neighborhoods/master/custom-pedia-cities-nyc-Mar2018.geojson';
const BASE = { color:'#ffffff', weight:1.2, fillColor:'#efefef', fillOpacity:1 };
const HOT  = { color:'#111', weight:1.5, fillColor:'#ffffff', fillOpacity:1 };
fetch(GEO).then(r => r.json()).then(gj => {
  const other = { type:'FeatureCollection', features: gj.features.filter(f => f.properties.borough !== 'Manhattan') };
  const man   = { type:'FeatureCollection', features: gj.features.filter(f => f.properties.borough === 'Manhattan') };
  L.geoJSON(other, { interactive:false, style:{ color:'#e2e2e2', weight:0.8, fillColor:'#e6e6e6', fillOpacity:1 } }).addTo(map);
  L.geoJSON(man, {
    style: () => BASE,
    onEachFeature: (f, lyr) => {
      const name = f.properties.neighborhood;
      const photo = PHOTOS[photoIdx++ % PHOTOS.length];
      lyr.bindTooltip(name, { sticky:true, direction:'top', offset:[0,-8], className:'hood-tip' });
      lyr.on('mouseover', () => { lyr.setStyle(HOT); lyr.bringToFront(); });
      lyr.on('mouseout',  () => lyr.setStyle(BASE));
      lyr.on('click', e => spawn({ name, photo, ...(CONTENT[name] || {}) }, e.containerPoint));
    }
  }).addTo(map);
}).catch(() => {
  document.getElementById('hint').textContent = 'map data failed to load';
});

closeAllBtn.addEventListener('click', () => {
  [...layer.querySelectorAll('.win:not(.closing)')].forEach((w, i) => setTimeout(() => closeWin(w), i * 35));
});
</script>
</body>
</html>
